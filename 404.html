<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Familiar</title>
  <meta name="robots" content="noindex">
  <!-- Self-contained on purpose: GitHub Pages serves this file for any unknown URL, at any depth,
       so relative links to css/ and js/ would break. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236c5ce7'/%3E%3Cstop offset='1' stop-color='%23ec7fb0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3Ccircle cx='20' cy='12' r='5' fill='%23fff' opacity='.92'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Inter:wght@400;600;800&display=swap">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #0f1220;
      --muted: #5b6075;
      --accent: #5b5bd6;
      --grad: linear-gradient(120deg, #6c5ce7 0%, #a46be8 45%, #ec7fb0 100%);
      --blood: #d4353b;
      --font: "Inter", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      --serif: "Cormorant Garamond", "Noto Serif TC", "Songti TC", Georgia, serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      text-align: center;
      transition: background-color 6s ease, color 6s ease;
    }
    main { max-width: 34rem; }
    .code {
      margin: 0;
      font-size: clamp(5rem, 22vw, 9rem);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 1;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 { margin: 18px 0 0; font-size: clamp(1.5rem, 4vw, 2rem); letter-spacing: -0.02em; text-wrap: balance; }
    p { margin: 12px 0 0; color: var(--muted); line-height: 1.6; }
    .home {
      display: inline-block;
      margin-top: 28px;
      padding: 13px 24px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 6s ease;
    }
    .home:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .whisper {
      margin-top: 40px;
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.5rem;
      color: var(--blood);
      opacity: 0;
      transition: opacity 3s ease;
    }
    :lang(zh-Hant) .whisper { font-style: normal; letter-spacing: 0.08em; }
    body.found { --bg: #0b0909; --fg: #d9cfbf; --muted: #8f8474; --accent: #a8121b; }
    body.found .whisper { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      body, .home, .whisper { transition-duration: 0.01s; }
    }
  </style>
  <script id="strings-404" type="application/json">
    {
      "en": {
        "docTitle": "Page not found — Familiar",
        "title": "Oops! We can't find that page.",
        "text": "The page you're looking for doesn't exist, or it may have moved.",
        "home": "Take me home",
        "whisper": "…but we found you."
      },
      "zh-Hant": {
        "docTitle": "找不到頁面 — Familiar",
        "title": "糟糕！找不到這個頁面。",
        "text": "你要找的頁面不存在，或已經移到別處了。",
        "home": "帶我回首頁",
        "whisper": "……但我們找到你了。"
      }
    }
  </script>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1 data-k="title">Oops! We can't find that page.</h1>
    <p data-k="text">The page you're looking for doesn't exist, or it may have moved.</p>
    <a class="home" id="home" href="/" data-k="home">Take me home</a>
    <p class="whisper" data-k="whisper" role="status">…but we found you.</p>
  </main>
  <script>
    (function () {
      'use strict';
      var T = JSON.parse(document.getElementById('strings-404').textContent);
      var lang = 'en';
      try {
        var norm = function (v) { return /^zh/i.test(v || '') ? 'zh-Hant' : /^en/i.test(v || '') ? 'en' : null; };
        var wanted = (navigator.languages || [navigator.language || '']).join(',');
        lang = norm(new URLSearchParams(location.search).get('lang')) ||
          norm(localStorage.getItem('familiar.lang')) ||
          (/(^|,)zh-(TW|HK|MO|Hant)/i.test(wanted) ? 'zh-Hant' : 'en');
      } catch (e) { /* English */ }
      var t = T[lang];
      document.documentElement.lang = lang;
      document.title = t.docTitle;
      document.querySelectorAll('[data-k]').forEach(function (el) { el.textContent = t[el.dataset.k]; });

      // On GitHub Pages a project site lives under /<repo>/, so "home" is that, not the domain root.
      var first = location.pathname.split('/')[1];
      if (/\.github\.io$/i.test(location.hostname) && first) document.getElementById('home').href = '/' + first + '/';

      // a moment of looking around, then the lights go out
      setTimeout(function () { document.body.classList.add('found'); }, 2600);
    })();
  </script>
</body>
</html>
