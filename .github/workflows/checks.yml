name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript parses
        run: for f in js/*.js scripts/*.js; do node --check "$f"; done
      - name: Every language has every message
        run: node scripts/check-i18n.js
